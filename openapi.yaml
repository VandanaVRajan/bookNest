openapi: 3.0.3
info:
  title: BookNest API
  version: 1.0.0
  description: >
    Book e-commerce backend. API-first: this spec drives backend code
    generation and frontend integration. Framework-agnostic by design.
servers:
  - url: http://localhost:8080/api/v1
    description: Local dev
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Catalogue
  - name: Addresses
  - name: Orders
paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Login, returns JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: JWT + user profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /categories:
    get:
      tags: [Catalogue]
      summary: List categories
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Category' }

  /brands:
    get:
      tags: [Catalogue]
      summary: List brands
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Brand' }

  /products:
    get:
      tags: [Catalogue]
      summary: List / filter products
      security: []
      parameters:
        - { name: categoryId, in: query, schema: { type: integer } }
        - { name: brandId, in: query, schema: { type: integer } }
        - { name: page, in: query, schema: { type: integer, default: 0 } }
        - { name: size, in: query, schema: { type: integer, default: 12 } }
      responses:
        '200':
          description: Paged products
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductPage' }
    post:
      tags: [Catalogue]
      summary: Create product
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }

  /products/{id}:
    get:
      tags: [Catalogue]
      summary: Product detail
      security: []
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Catalogue]
      summary: Update product
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductCreate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
    delete:
      tags: [Catalogue]
      summary: Delete product
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '204': { description: Deleted }

  /products/{id}/related:
    get:
      tags: [Catalogue]
      summary: Related products
      security: []
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Product' }

  /addresses:
    get:
      tags: [Addresses]
      summary: Saved addresses
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Address' }
    post:
      tags: [Addresses]
      summary: Add address
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddressCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Address' }

  /checkout:
    post:
      tags: [Orders]
      summary: Checkout
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheckoutRequest' }
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400': { description: Empty cart / insufficient stock / insufficient gift points }
        '402':
          description: Mock payment declined
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /orders:
    get:
      tags: [Orders]
      summary: Order history
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Order' }

  /orders/{id}/cancel:
    post:
      tags: [Orders]
      summary: Cancel order
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '409': { $ref: '#/components/responses/Conflict' }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer }
  responses:
    Unauthorized:
      description: Missing/invalid token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Cancellation window expired or already shipped
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      properties:
        message: { type: string }
    LoginRequest:
      type: object
      properties:
        email: { type: string, example: demo@booknest.com }
        password: { type: string, example: demo123 }
    UserProfile:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        role: { type: string, enum: [CUSTOMER, ADMIN] }
        giftPoints: { type: integer, example: 500 }
    AuthResponse:
      type: object
      properties:
        token: { type: string }
        user: { $ref: '#/components/schemas/UserProfile' }
    Category:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
    Brand:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
    Product:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        author: { type: string }
        isbn: { type: string }
        publicationDate: { type: string, format: date }
        price: { type: number, format: double }
        stock: { type: integer }
        imageUrl: { type: string }
        description: { type: string }
        categoryId: { type: integer }
        categoryName: { type: string }
        brandId: { type: integer }
        brandName: { type: string }
        deliveryEstimateDays: { type: integer, example: 5 }
    ProductCreate:
      type: object
      properties:
        title: { type: string }
        author: { type: string }
        isbn: { type: string }
        publicationDate: { type: string, format: date }
        price: { type: number }
        stock: { type: integer }
        imageUrl: { type: string }
        description: { type: string }
        categoryId: { type: integer }
        brandId: { type: integer }
    ProductPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Product' }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer }
    Address:
      type: object
      properties:
        id: { type: integer }
        fullName: { type: string }
        street: { type: string }
        city: { type: string }
        state: { type: string }
        zip: { type: string }
        country: { type: string }
        phone: { type: string }
    AddressCreate:
      type: object
      properties:
        fullName: { type: string }
        street: { type: string }
        city: { type: string }
        state: { type: string }
        zip: { type: string }
        country: { type: string }
        phone: { type: string }
    CheckoutItem:
      type: object
      properties:
        productId: { type: integer }
        quantity: { type: integer, minimum: 1 }
    CheckoutRequest:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CheckoutItem' }
        addressId: { type: integer }
        paymentMethod: { type: string, enum: [CARD, UPI, COD] }
        useGiftPoints: { type: boolean, default: false }
    OrderItem:
      type: object
      properties:
        productId: { type: integer }
        title: { type: string }
        author: { type: string }
        imageUrl: { type: string }
        unitPrice: { type: number }
        quantity: { type: integer }
        subtotal: { type: number }
    Order:
      type: object
      properties:
        id: { type: integer }
        orderNumber: { type: string, example: BN-2026-000123 }
        status: { type: string, enum: [PLACED, SHIPPED, CANCELLED, PAYMENT_FAILED] }
        placedAt: { type: string, format: date-time }
        deliveryDate: { type: string, format: date }
        address: { $ref: '#/components/schemas/Address' }
        items:
          type: array
          items: { $ref: '#/components/schemas/OrderItem' }
        subtotal: { type: number }
        tax: { type: number }
        total: { type: number }
        giftPointsUsed: { type: integer }
        paymentMethod: { type: string, enum: [CARD, UPI, COD] }
        cancellable: { type: boolean }